# Copy to /etc/match-alerts/config.toml and fill in.
# Nothing secret belongs in this file except the API-Football key; the FCM
# credential lives in its own file, referenced by path.

[api_football]
key  = "PUT-THE-API-FOOTBALL-KEY-HERE"
base = "https://v3.football.api-sports.io"
# The competitions the app shows, in the app's own running order.
leagues = [2, 3, 39, 140, 135, 78, 61, 307]

[fcm]
project_id = "iptv-player-7e925"
# A service account with cloudmessaging.messages.create and nothing else.
# Leave empty to fall back to Application Default Credentials.
credentials_file = "/etc/match-alerts/service-account.json"

[worker]
# Where the sent-log lives. Must survive a restart, or every restart would
# re-announce the matches it had already announced.
state_db = "/var/lib/match-alerts/state.db"

# How often the live feed is read. One request each time.
poll_seconds = 60

# How often the day's fixture list is re-read, for today and tomorrow. Kickoff
# times barely move, so this is the cheap half of the request budget.
schedule_refresh_seconds = 1800

# How late a pre-match alert may be and still be sent. Sized to the poll, not
# to a comfortable round number: an alert titled "in 45 minutes" arriving 35
# minutes before kickoff is wrong in a way the reader cannot detect.
# Leave at 0 to use twice the poll interval.
pre_match_window_seconds = 0

# How long a failed pre-match alert stays worth retrying.
pre_match_retry_seconds = 300

# A result older than this is not announced, measured from when the finish was
# first seen rather than from kickoff.
max_result_age_minutes = 240

# Nothing is sent while this is true, and it is the only thing that decides it
# for the service. `--send` on the command line overrides it for one manual
# run; there is no other switch. True by default on purpose: a sender that
# starts talking to real phones the moment it is installed is the wrong default
# for something that cannot be unsent.
dry_run = true
